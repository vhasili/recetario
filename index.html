    if (x.tipo === "congelado") pills.push(`<span class="pill batch">Del congelador</span>`);
    if (x.tipo === "idea") pills.push(`<span class="pill idea">Idea</span>`);
    if (x.batch) pills.push(`<span class="pill batch">Batch</span>`);

    if (x.grupo && x.grupo !== "otro" && GRUPOS[x.grupo]) pills.push(`<span class="gtag">${GRUPOS[x.grupo]}</span>`);
    const title = x.tipo === "libre" ? `<span class="muted">${esc(x.titulo || "Libre")}</span>`
      : r && x.tipo !== "congelado" ? `<button class="dishbtn" data-act="mOpen" data-id="${r.id}">${esc(r.titulo)}</button>`
      : `<span class="dishname">${esc(x.titulo)}</span>`;
    body = `${title}${pills.length ? `<div class="pills">${pills.join("")}</div>` : ""}${x.nota ? `<p class="small muted" style="margin:3px 0 0">${esc(x.nota)}</p>` : ""}`;
  }
  return `<div class="slot"><span class="lbl">${m === "comida" ? "Comida" : "Cena"}${x ? `<span class="pp">${slotPers(menu, x)} pers.</span>` : ""}</span><div class="dish">${body}</div>${S.canWrite ? `<button class="iconbtn sm" data-act="mEdit" data-d="${i}" data-m="${m}" aria-label="Cambiar ${m} del ${DIAS[i].toLowerCase()}">${ICON.edit}</button>` : ""}</div>`;
}
function batchHTML(menu){
  const b = menu.batch;
  if (!b || !(b.pasos||[]).length) return "";
  const sum = b.pasos.reduce((a,x) => a + (x.minutos || 0), 0);
  const hecho = menu.batchHecho || {};
  return `<section class="panel"><div class="phead"><h2>Batch cooking</h2><span class="pill batch">${esc(batchLabel(menu.config))}</span></div>
    ${b.tiempo_total_min ? `<p class="small muted" style="margin:0 0 4px">Unos ${fmtMin(b.tiempo_total_min)} en total.</p>` : sum ? `<p class="small muted" style="margin:0 0 4px">${fmtMin(sum)} sumando las recetas; menos si cocinas varias a la vez.</p>` : ""}
    <ul class="ings">${b.pasos.map((x,i) => `<li class="ing${hecho[i] ? " done" : ""}"><input type="checkbox" id="bs-${i}" data-act="mBatchStep" data-i="${i}"${hecho[i] ? " checked" : ""}><span class="q">${x.minutos ? fmtMin(x.minutos) : ""}</span><span class="n"><label for="bs-${i}">${esc(x.texto)}</label>${(x.receta_ids||[]).map(getR).filter(Boolean).map(r => ` <button class="linkbtn" data-act="mOpen" data-id="${r.id}">ver receta</button>`).join("")}</span></li>`).join("")}</ul>
    ${(b.conservacion||[]).length ? `<p class="lbl" style="margin:12px 0 4px">Conservación</p><ul class="plain">${b.conservacion.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  </section>`;
}
function shopping(menu){
  const cfg = menu.config || {};
  const pantry = wordSet((cfg.nevera||"") + " " + (cfg.congelador||""));
  const map = new Map();
  const add = (nombre, q, u, from) => {
    let ul = (u||"").trim().toLowerCase();
    if (ul === "kg"){ if (q != null) q *= 1000; ul = "g"; }
    if (ul === "l"){ if (q != null) q *= 1000; ul = "ml"; }
    const key = slug(nombre + " " + ul);
    const it = map.get(key) || {key, nombre, unidad: ul, q: 0, hasQ: false, de: new Set()};
    if (q != null){ it.q += q; it.hasQ = true; }
    if (from) it.de.add(from);
    map.set(key, it);
  };
  (menu.dias||[]).forEach(d => MEALS.forEach(m => {
    const x = d && d[m]; if (!x || !x.receta_id || x.tipo === "congelado") return;
    const r = getR(x.receta_id); if (!r) return;
    const f = r.raciones ? slotPers(menu, x) / r.raciones : 1;
    (r.ingredientes||[]).forEach(i => add(i.nombre, i.cantidad != null ? i.cantidad * f : null, i.unidad, r.id));
  }));
  const all = [...map.values()].sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
  const ideas = (menu.ideas_ingredientes||[]).map(i => ({key: "idea-" + slug(i.nombre + " " + (i.unidad||"")), nombre: i.nombre, unidad: (i.unidad||"").toLowerCase(), q: i.cantidad, hasQ: i.cantidad != null, de: new Set()}));
  const enCasa = all.filter(it => inSet(it.nombre, pantry));
  const items = all.filter(it => !enCasa.includes(it));
  return {items, ideas, enCasa};
}
function qtyOf(it){
  if (!it.hasQ) return it.unidad === "al gusto" ? "al gusto" : "";
  let q = it.q, u = it.unidad;
  if (u === "g" && q >= 1000){ q /= 1000; u = "kg"; }
  if (u === "ml" && q >= 1000){ q /= 1000; u = "l"; }
  return ingLine({cantidad: q, unidad: u, nombre: "", nota: ""}, 1).qty;
}
function shopHTML(menu){
  const {items, ideas, enCasa} = shopping(menu);

  return `<section class="panel"><div class="phead"><h2>Lista de la compra</h2><button class="textbtn" data-act="mCopyShop">Copiar</button></div>
    <p class="small muted" style="margin:0 0 4px">Con las personas de cada comida. Lo que marquéis se ve marcado en todos los móviles.</p>
    <ul class="ings">${items.map(row).join("")}${ideas.length ? `<li class="grp">Para las ideas</li>${ideas.map(row).join("")}` : ""}${enCasa.length ? `<li class="grp">Puede que ya lo tengáis</li><li class="small muted" style="padding:0 0 4px">Está en la nevera o el congelador; comprueba que llega.</li>${enCasa.map(row).join("")}` : ""}</ul></section>`;
}

function relTime(t){
  if (!t) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "ahora mismo";
  if (m < 60) return `hace ${m} min`;
  const d = new Date(t);
  return d.toDateString() === new Date().toDateString() ? `a las ${d.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"})}` : d.toLocaleDateString("es-ES", {day: "numeric", month: "short"});
}

async function blobIdToDataURL(id){

}
async function exportBackup(){

    const fotos_data = [];

    const pasos = [];
    for (const p of (r.pasos || [])){ const q = {...p}; if (p.foto){ const d = await blobIdToDataURL(p.foto); if (d) q.foto_data = d; } pasos.push(q); }
    recetas.push({...r, pasos, fotos_data});
  }

  await saveFile(`recetario-${slug(S.uid || "familia")}-${today()}.json`, JSON.stringify(data));

async function mergeBackup(full, withMenu){
  let nuevas = 0, act = 0;
  for (const rr of (full.recetas || [])){
    if (!rr || !rr.id || !rr.titulo || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(rr.id)) continue;
    const {fotos_data, ...r} = rr;
    for (const f of (fotos_data || [])) if (f && f.id && typeof f.data === "string" && f.data.startsWith("data:image/")) await window.__assets.putWithId(f.id, await dataURLToBlob(f.data));
    r.fotos = (r.fotos || []).filter(id => window.__hasBlob(id));
    const pasos = [];
    for (const p of (rr.pasos || [])){
      const {foto_data, ...q} = p || {};
      if (q.foto && typeof foto_data === "string" && foto_data.startsWith("data:image/")) await window.__assets.putWithId(q.foto, await dataURLToBlob(foto_data));
      if (q.foto && !window.__hasBlob(q.foto)) delete q.foto;
      pasos.push(q);
    }
    r.pasos = pasos;
    const local = getR(r.id);
    const val = {...((local && local.valoraciones) || {}), ...(r.valoraciones || {})};
    const ref = S.db.doc("recetas/" + r.id);
    if (!local){ await ref.set({...r, valoraciones: val, id: undefined}); nuevas++; }
    else if (String(r.actualizadaEn || "") > String(local.actualizadaEn || "")){ await ref.set({...r, valoraciones: val, favorita: !!local.favorita, id: undefined}); act++; }
    else if (JSON.stringify(val) !== JSON.stringify(local.valoraciones || {})){ await ref.update({valoraciones: val}); act++; }
  }
  if (withMenu && full.menu && typeof full.menu === "object") await S.db.doc("menus/actual").set(full.menu);
  return {nuevas, act};
}

  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName !== "INPUT") e.preventDefault();
  fn(b, e);
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "sort"){ S.sort = t.value; savePrefs(); updateList(); }
  if (t.dataset && t.dataset.slot && S.mcfg){ const [i, m] = t.dataset.slot.split("-"); S.mcfg.slots[+i][m] = +t.value; t.classList.toggle("off", !+t.value); }
  if (t.dataset && t.dataset.stepMedia && t.files.length){
    const row = t.closest(".prow"), k = t.dataset.stepMedia, f = t.files[0], box = $(".pmedia", row);
    box.insertAdjacentHTML("beforeend", `<span class="status small"><span class="spin"></span>Subiendo…</span>`);
    try {
      const id = await uploadImage(f);
      row.dataset[k] = id; if (S.draft) S.draft.added.push(id);
    } catch(err){ toast(err && err.code === "too_large" ? "El archivo es demasiado grande" : err && err.code === "quota_or_state" ? "No queda espacio para archivos" : "No se pudo subir el archivo"); }
    box.innerHTML = stepMediaHTML({foto: row.dataset.foto});
    return;
  }
  if (t.id === "ph-in" && t.files.length){
    const files = Array.from(t.files); const box = $("#photos");
    box.insertAdjacentHTML("beforeend", `<span class="status small" id="ph-status"><span class="spin"></span>Subiendo…</span>`);
    for (const f of files){ try { S.draft.fotos.push(await uploadImage(f)); } catch(err){ toast(err.code === "too_large" ? "Foto demasiado grande" : err.code === "quota_or_state" ? "No queda espacio para fotos" : "No se pudo subir la foto"); } }
    if (S.draft) $("#photos").innerHTML = photosHTML();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ S.q = e.target.value; updateList(); }
  if (e.target.id === "ms-q"){ const q = deacc(e.target.value.toLowerCase().trim()); $$("#ms-list button").forEach(b => { b.hidden = !!q && !b.dataset.s.includes(q); }); }
});
document.addEventListener("submit", e => { if (e.target.id === "editform"){ e.preventDefault(); saveDraft(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if ($("#overlay").innerHTML) closeSheet(); else if (S.cookOpen) closeCook(); } });
document.addEventListener("visibilitychange", () => { if (S.cookOpen && document.visibilityState === "visible" && !S.wakeLock) { try { navigator.wakeLock?.request("screen").then(l => S.wakeLock = l).catch(()=>{}); } catch(e){} } });

/* ---------- Arranque ---------- */
render();
(async function init(){
  const use = n => (window.claude && claude.use) ? claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, assets, sample, downloads] = await Promise.all(["db","user","assets","sample","downloads"].map(use));
  Object.assign(S, {db, user, assets, sample, downloads});
  if (user){ try { S.uid = await user.id(); } catch(e){} try { const c = await user.can("data.write"); S.canWrite = c !== false; } catch(e){} }
  S.uid = window.__nombre();
  if (sample){ try { const lim = await sample.limits(); S.canImages = !!lim.images; if (lim.images) S.maxImages = Math.min(5, lim.images.maxCount || 5); } catch(e){} }
  if (!db){ S.noDb = true; S.canWrite = false; S.loaded = true; if (S.view === "list") { $("#view").innerHTML = ""; } render(); return; }
  if (S.view === "list") $("#view").innerHTML = "";
  render();
  const sub = () => db.collection("recetas").onSnapshot(snap => {
    S.recetas = snap.docs.map(d => ({...d.data(), id: d.id}));
    S.loaded = true;
    if (S.view !== "edit") render();
  }, err => {
    if (err && err.code === "unavailable") setTimeout(sub, 3000);
    else { S.loaded = true; S.noDb = err && err.code === "revoked"; render(); }
  });
  sub();
  setTimeout(handleShareTarget, 300);
  db.doc("menus/actual").onSnapshot(snap => {
    S.menu = snap.exists ? snap.data() : null; S.menuLoaded = true;
    if (S.view === "menu") render();
  }, () => { S.menuLoaded = true; if (S.view === "menu") render(); });
})();
</script>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
