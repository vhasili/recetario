<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c3fa8">
<meta name="description" content="Recetario familiar: recetas probadas y por probar, modo cocina, menú semanal y lista de la compra.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recetario">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Recetario da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: una sola columna tipo app móvil; cabecera fija con cenefa de loza azul, lista de fichas, hojas inferiores para acciones, modo cocina a pantalla completa */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#edf1f9; --ink:#15203b; --ink-2:#4b5675; --line:#d9dfec;
  --cobalt:#1c3fa8; --cobalt-ink:#ffffff; --cobalt-soft:#e2e9fb;
  --ok:#2c7a4c; --ok-soft:#e0f1e6; --wait:#9a6300; --wait-soft:#fbedd2; --danger:#b3261e; --star:#d89a00;
  --shadow:0 1px 2px rgba(21,32,59,.06),0 6px 20px rgba(21,32,59,.07);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --hb:0px;
}
html.embedded{--hb:56px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1221; --surface:#151c30; --surface-2:#1c2540; --ink:#e8ecf7; --ink-2:#a6b0ca; --line:#29334f;
  --cobalt:#8ea8ff; --cobalt-ink:#0d1221; --cobalt-soft:#1e2a52;
  --ok:#7ed1a0; --ok-soft:#14301f; --wait:#f0c264; --wait-soft:#372b10; --danger:#ff8a80; --star:#f3c14e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1221; --surface:#151c30; --surface-2:#1c2540; --ink:#e8ecf7; --ink-2:#a6b0ca; --line:#29334f;
  --cobalt:#8ea8ff; --cobalt-ink:#0d1221; --cobalt-soft:#1e2a52;
  --ok:#7ed1a0; --ok-soft:#14301f; --wait:#f0c264; --wait-soft:#372b10; --danger:#ff8a80; --star:#f3c14e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + var(--hb))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#view{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
a{color:var(--cobalt)}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:700}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand h1{font-size:1.65rem;color:var(--cobalt);line-height:1.1}
.brand span{font-size:.8rem;color:var(--ink-2)}
.cenefa{height:8px;margin:0 0 12px;border-radius:2px;
  background:
   radial-gradient(circle at 6px 4px,var(--cobalt) 2.2px,transparent 2.6px) 0 0/12px 8px,
   linear-gradient(var(--cobalt),var(--cobalt)) 0 0/100% 1px no-repeat,
   linear-gradient(var(--cobalt),var(--cobalt)) 0 100%/100% 1px no-repeat;opacity:.85}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.textbtn{border:0;background:none;color:var(--cobalt);font-weight:700;padding:10px 4px;display:inline-flex;align-items:center;gap:4px}

/* Buscador y pestañas */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px}
.search svg{position:absolute;left:13px;top:13px;width:22px;height:22px;color:var(--ink-2)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:.84rem;font-weight:700;color:var(--ink-2);line-height:1.2}
.tabs button b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--cobalt);box-shadow:var(--shadow)}
.tabs button[aria-selected="true"] b{color:var(--cobalt)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px}
.sortrow select{border:0;background:none;color:var(--cobalt);font-weight:700;padding:6px 0}

/* Fichas */
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--cobalt-soft);display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;color:var(--cobalt);overflow:hidden}
.card .t{font-family:var(--f-display);font-size:1.08rem;line-height:1.25;margin-bottom:4px;overflow-wrap:anywhere}
.card .m{font-size:.84rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.fav{color:var(--danger)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:left}
.empty h2{font-size:1.35rem;margin-bottom:6px}
.empty ul{padding-left:18px;margin:10px 0 16px;color:var(--ink-2)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.fab{position:fixed;z-index:6;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px) + var(--hb));
  border:0;border-radius:16px;background:var(--cobalt);color:var(--cobalt-ink);font-weight:700;padding:15px 20px;box-shadow:0 6px 20px rgba(28,63,168,.35);display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}

/* Detalle */
.hero{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:var(--r);background:var(--surface-2);display:block}
.dhead{display:flex;flex-direction:column;gap:8px;margin:14px 0 12px}
.dhead h1{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.12;overflow-wrap:anywhere}
.dhead p{margin:0;color:var(--ink-2);max-width:65ch}
.src{font-size:.88rem;color:var(--ink-2);overflow-wrap:anywhere}
.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.metas div{background:var(--surface);padding:9px 6px;text-align:center}
.metas b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.1rem;font-variant-numeric:tabular-nums}
.metas span{font-size:.72rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.panel h2{font-size:1.3rem}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:40px;border:0;background:var(--surface-2);font-size:1.2rem;font-weight:700}
.stepper output{min-width:96px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.ings{list-style:none;margin:0;padding:0}
.ings .grp{font-family:var(--f-display);font-size:1rem;color:var(--cobalt);padding:10px 0 2px}
.ing{display:grid;grid-template-columns:28px 92px 1fr;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing input{width:20px;height:20px;accent-color:var(--cobalt);transform:translateY(3px)}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--cobalt)}
.ing .n{min-width:0;overflow-wrap:anywhere}
.ing.done .n,.ing.done .q{text-decoration:line-through;opacity:.5}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;font-family:var(--f-display)}
.steps p{margin:0;min-width:0;overflow-wrap:anywhere}
.tchip{margin-top:6px;border:1px solid var(--cobalt);color:var(--cobalt);background:none;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:1.7rem;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--star)}
.starline{color:var(--star);letter-spacing:1px}
.votes{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.vote{display:flex;align-items:center;gap:8px;font-size:.92rem}
.vote img{width:24px;height:24px;border-radius:50%}
.tried{display:flex;flex-direction:column;gap:10px}
.notes{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.cookbar{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px) + var(--hb)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cookbar .btn{max-width:720px;margin:0 auto;display:flex;width:100%;font-size:1.05rem}

/* Editor */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea,.irow input,.prow textarea,.prow input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--cobalt);box-shadow:var(--shadow)}
.irow{display:grid;grid-template-columns:70px 78px 1fr 40px;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.irow .i-nota{grid-column:1/4;min-height:38px;font-size:.9rem}
.irow.grp{grid-template-columns:1fr 40px}
.irow.grp input{font-family:var(--f-display);color:var(--cobalt)}
.prow{display:grid;grid-template-columns:1fr 40px;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow textarea{min-height:70px;resize:vertical}
.prow .tmin{grid-column:1/2;display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-2)}
.prow .tmin input{width:90px;min-height:38px}
.del{width:40px;height:44px;border:0;background:none;color:var(--danger);font-size:1.3rem}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:96px;height:96px}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.ph em{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:.7rem;background:var(--cobalt);color:var(--cobalt-ink);border-radius:6px;padding:1px 6px}
.addph{width:96px;height:96px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--ink-2);background:var(--surface);cursor:pointer}
.addph input{display:none}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px) + var(--hb));background:linear-gradient(transparent,var(--bg) 25%)}
.savebar .btn{flex:1}

/* Hojas inferiores */
.sheet{max-width:680px;margin:0 auto;padding-block:0 calc(160px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;padding-block:10px 6px}
.sheet .inner{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet h2{font-size:1.4rem}
.menu{display:flex;flex-direction:column}
.menu button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:14px 4px;font-weight:700;display:flex;flex-direction:column}
.menu button span{font-weight:400;font-size:.86rem;color:var(--ink-2)}
.menu button:last-child{border-bottom:0}
.hint{font-size:.86rem;color:var(--ink-2);margin:0}
pre.prompt{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:.8rem;max-height:40dvh;overflow:auto;margin:0;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-weight:700;margin:0}
.prev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prev label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}
.prev input{width:20px;height:20px;accent-color:var(--cobalt);flex:none;margin-top:2px}
.warn{color:var(--wait);font-size:.84rem;font-weight:700}

/* Modo cocina */
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.cook .ctop{display:flex;align-items:center;gap:10px}
.cook .ctop h2{flex:1;font-size:1.1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--surface-2);border-radius:2px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cobalt)}
.cbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;padding:24px 0 160px;max-width:720px;width:100%;margin:0 auto}
.cbody .num{font-family:var(--f-display);color:var(--cobalt);font-size:1.1rem}
.cbody .txt{font-size:clamp(1.35rem,5.6vw,2rem);line-height:1.38;margin:0;overflow-wrap:anywhere}
.cnav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:720px;width:100%;margin:0 auto}
.cnav .btn{min-height:58px;font-size:1.05rem}
.cings{max-height:45dvh;overflow:auto}

/* Temporizadores y avisos */
.timers{position:fixed;z-index:25;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px) + var(--hb));display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 32px)}
.timer{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.timer b{font-variant-numeric:tabular-nums;font-size:1.15rem}
.timer span{font-size:.82rem;opacity:.85;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:8px;padding:6px 10px;font-weight:700}
.timer.done{background:var(--danger);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px) + var(--hb));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
/* Fotos de los pasos */
.prow .pmedia{grid-column:1/2}
.pmedia{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pmedia:empty{display:none}
.mbtn{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.88rem;color:var(--cobalt);background:var(--surface);cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.mbtn input{display:none}
.ph.sm,.ph.sm img{width:72px;height:72px}
.steps li > div{min-width:0}
.stepimg{display:block;width:100%;max-width:100%;max-height:360px;object-fit:cover;border-radius:10px;margin-top:8px;background:var(--surface-2)}
.cbody .stepimg{max-height:36dvh;object-fit:contain}
.gallery{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.gallery button{border:0;padding:0;background:none;flex:none;border-radius:8px}
.gallery img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
/* Menú semanal */
.iconbtn.wide{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font-weight:700;color:var(--cobalt)}
.iconbtn.wide svg{width:20px;height:20px}
.slotgrid{display:grid;grid-template-columns:1fr 104px 104px;gap:6px 8px;align-items:center;margin-top:6px}
.slotgrid .dname{font-weight:700}
.tg{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;color:var(--ink-2)}
.tg:not(.off){background:var(--cobalt-soft);border-color:transparent;color:var(--cobalt)}
.slot .lbl .pp{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.78rem;margin-top:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--cobalt);flex:none}
.week{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 4px}
.day.today{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt)}
.day h3{font-size:1.15rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.day h3 .small{font-family:var(--f-body)}
.slot{display:grid;grid-template-columns:62px 1fr 40px;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.slot .lbl{padding-top:4px}
.dish{min-width:0}
.dishbtn{border:0;background:none;padding:0;text-align:left;font-family:var(--f-display);font-size:1.05rem;color:var(--cobalt);line-height:1.3;overflow-wrap:anywhere}
.dishname{font-family:var(--f-display);font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px}
.pill.batch{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.idea,.pill.left{background:var(--surface-2);color:var(--ink-2)}
.gtag{font-size:.78rem;color:var(--ink-2);padding:2px 2px}
.iconbtn.sm{width:40px;height:40px;border-radius:10px}
.iconbtn.sm svg{width:18px;height:18px}
.bal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bal .b{border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.bal .b.ok{background:var(--ok-soft);color:var(--ok)}
.bal .b.wait{background:var(--wait-soft);color:var(--wait)}
.bal b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.bal span{font-weight:700;font-size:.8rem}
.bal small{font-size:.7rem;line-height:1.25}
@media (max-width:370px){.bal{grid-template-columns:repeat(2,1fr)}}
.linkbtn{border:0;background:none;color:var(--cobalt);font-weight:700;padding:0 2px;font-size:.88rem;text-decoration:underline}
ul.plain{margin:0;padding-left:18px;color:var(--ink-2);font-size:.92rem}
.menu.pick{max-height:34dvh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.inp{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:var(--surface)}
@media (prefers-reduced-motion: reduce){.spin,.timer.done{animation:none}}
@media (min-width:600px){.card{grid-template-columns:96px 1fr}.thumb{width:96px;height:96px}}

<script>
/* CONFIGURACIÓN: pega entre las comillas la "App key" de tu app de Dropbox */
window.RECETARIO_DROPBOX_KEY = "";

<script>
/* Recetario da Casa · versión independiente
   Datos en el propio móvil (IndexedDB). IA opcional con clave propia. */
"use strict";
(function(){
  const DBNAME = window.__dbName || "recetario-da-casa";
  let dbp = null;
  function idb(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DBNAME, 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("docs"); d.createObjectStore("blobs"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idbAll(store){
    const d = await idb();
    return new Promise((res, rej) => {
      const out = {}; const c = d.transaction(store).objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } else res(out); };
      c.onerror = () => rej(c.error);
    });
  }
  async function idbPut(store, key, val){
    const d = await idb();
    return new Promise((res, rej) => { const t = d.transaction(store, "readwrite"); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  }
  async function idbDel(store, key){
    const d = await idb();
    return new Promise((res, rej) => { const t = d.transaction(store, "readwrite"); t.objectStore(store).delete(key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  }
  const rid = (n=20) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join(""); };
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---- Base de datos local con la misma forma que usa la app ---- */
  const docs = new Map(), subs = new Set();
  const meta = {fromCache: false, hasPendingWrites: false};
  function snapDoc(path){ const d = docs.get(path); return {id: path.split("/").pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: meta}; }
  function snapCol(col){
    const out = [];
    for (const p of docs.keys()) if (p.slice(0, p.lastIndexOf("/")) === col) out.push(snapDoc(p));
    out.sort((a, b) => a.id.localeCompare(b.id));
    return {docs: out, size: out.length, empty: !out.length, docChanges: () => [], metadata: meta};
  }
  function notify(path){
    const col = path.slice(0, path.lastIndexOf("/"));
    subs.forEach(s => { try {
      if (s.type === "doc" && s.path === path) s.fn(snapDoc(path));
      if (s.type === "col" && s.path === col) s.fn(snapCol(col));
    } catch(e){ console.error(e); } });
  }
  function merge(a, b){
    const o = {...a};
    for (const k of Object.keys(b)){
      const v = b[k];
      o[k] = v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k]) ? merge(o[k], v) : v;
    }
    return o;
  }
  const TOMB = "__meta/tomb";
  let tomb = {};
  async function write(path, data){
    const now = Date.now();
    if (data === null){ docs.delete(path); tomb[path] = now; notify(path); await idbDel("docs", path); await idbPut("docs", TOMB, tomb); }
    else {
      data._mod = now; docs.set(path, data); notify(path); await idbPut("docs", path, data);
      if (tomb[path]){ delete tomb[path]; await idbPut("docs", TOMB, tomb); }
    }
    SYNC.later();
  }
  function notifyAll(){ subs.forEach(s => { try { s.fn(s.type === "col" ? snapCol(s.path) : snapDoc(s.path)); } catch(e){ console.error(e); } }); }
  let ready = null;
  function docRef(path){
    return {id: path.split("/").pop(), path,
      get: async () => { await ready; return snapDoc(path); },
      set: async d => { await ready; await write(path, clone(d)); },
      update: async d => { await ready; const cur = docs.get(path); if (!cur) throw {code: "invalid_argument", message: "no existe"}; await write(path, merge(cur, clone(d))); },
      delete: async () => { await ready; await write(path, null); },
      onSnapshot(fn){ const s = {type: "doc", path, fn}; subs.add(s); ready.then(() => subs.has(s) && fn(snapDoc(path))); return () => subs.delete(s); },
      collection: sub => colRef(path + "/" + sub)};
  }
  function colRef(path){
    const q = {path,
      doc: id => docRef(path + "/" + (id || rid())),
      add: async d => { const r = docRef(path + "/" + rid()); await r.set(d); return r; },
      get: async () => { await ready; return snapCol(path); },
      onSnapshot(fn){ const s = {type: "col", path, fn}; subs.add(s); ready.then(() => subs.has(s) && fn(snapCol(path))); return () => subs.delete(s); },
      where(){ return q; }, orderBy(){ return q; }, limit(){ return q; }};
    return q;
  }
  const DB = {doc: docRef, collection: colRef};

  /* ---- Fotos ---- */
  const urls = new Map();
  const EMPTY = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  window.__blobURL = id => urls.get(id) || EMPTY;
  window.__hasBlob = id => urls.has(id);
  const ASSETS = {
    async upload(blob){ const id = rid(32); await idbPut("blobs", id, blob); urls.set(id, URL.createObjectURL(blob)); return {id, url: urls.get(id), sizeBytes: blob.size, contentType: blob.type}; },
    async putWithId(id, blob){ if (urls.has(id)) return; await idbPut("blobs", id, blob); urls.set(id, URL.createObjectURL(blob)); },
    async delete(id){ await idbDel("blobs", id); const u = urls.get(id); if (u) URL.revokeObjectURL(u); urls.delete(id); return {deleted: true}; },
    async list(){ return {assets: [...urls.keys()].map(id => ({id, url: urls.get(id)})), usage: {}}; }
  };
  window.__assets = ASSETS;

  /* ---- Quién usa el móvil ---- */
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  window.__nombre = () => lsGet("recetario-nombre", "").trim() || null;
  window.__setNombre = n => lsSet("recetario-nombre", String(n || "").trim());
  const USER = {
    isOwner: async () => true, canEdit: async () => true, can: async () => true,
    id: async () => window.__nombre(),
    me: async () => ({id: window.__nombre(), name: window.__nombre() || "", avatarUrl: "", color: "", email: null, isOwner: true, canEdit: true}),
    profiles: async ids => Object.fromEntries((Array.isArray(ids) ? ids : [ids]).map(id => [id, {id, name: id, avatarUrl: "", color: "", email: null, isMe: id === window.__nombre(), guest: false}])),
    search: async () => []
  };

  /* ---- IA con clave propia ---- */
  window.__aiCfg = () => { try { return JSON.parse(lsGet("recetario-ia", "{}")) || {}; } catch(e){ return {}; } };
  window.__setAiCfg = c => lsSet("recetario-ia", JSON.stringify(c || {}));
  window.__aiOn = () => { const c = window.__aiCfg(); return !!(c.prov && c.key); };
  const DEF_MODEL = {gemini: "gemini-flash-latest", openai: "gpt-5-mini", anthropic: "claude-sonnet-5-5"};
  window.__defModel = DEF_MODEL;
  function toJPEG(b){
    return new Promise(async res => {
      try {
        const bmp = await createImageBitmap(b); const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        c.toBlob(x => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(x); }, "image/jpeg", .85);
      } catch(e){ const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(b); }
    });
  }
  function httpErr(status, msg){
    if (status === 401 || status === 403) return {code: "bad_key", message: msg};
    if (status === 404) return {code: "bad_model", message: msg};
    if (status === 429) return {code: "rate_limited", message: msg};
    if (status === 400 && /api key|api_key|credential/i.test(msg || "")) return {code: "bad_key", message: msg};
    return {code: "upstream_error", message: msg || ("HTTP " + status)};
  }
  async function ask(prompt, images, signal){
    const c = window.__aiCfg();
    if (!c.prov || !c.key) throw {code: "not_granted"};
    const model = (c.model || "").trim() || DEF_MODEL[c.prov];
    const imgs = [];
    for (const b of (images ? Array.from(images) : [])) imgs.push(await toJPEG(b));
    let r, j;
    try {
      if (c.prov === "gemini"){
        r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {method: "POST", signal,
          headers: {"Content-Type": "application/json", "x-goog-api-key": c.key},
          body: JSON.stringify({contents: [{role: "user", parts: [...imgs.map(d => ({inline_data: {mime_type: "image/jpeg", data: d}})), {text: prompt}]}], generationConfig: {responseMimeType: "application/json"}})});
        j = await r.json().catch(() => ({}));
        if (!r.ok) throw httpErr(r.status, j.error && j.error.message);
        return ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || "").join("");
      }
      if (c.prov === "openai"){
        r = await fetch("https://api.openai.com/v1/chat/completions", {method: "POST", signal,
          headers: {"Content-Type": "application/json", "Authorization": "Bearer " + c.key},
          body: JSON.stringify({model, response_format: {type: "json_object"}, messages: [{role: "user", content: [...imgs.map(d => ({type: "image_url", image_url: {url: "data:image/jpeg;base64," + d}})), {type: "text", text: prompt}]}]})});
        j = await r.json().catch(() => ({}));
        if (!r.ok) throw httpErr(r.status, j.error && j.error.message);
        return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      }
      if (c.prov === "anthropic"){
        r = await fetch("https://api.anthropic.com/v1/messages", {method: "POST", signal,
          headers: {"Content-Type": "application/json", "x-api-key": c.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
          body: JSON.stringify({model, max_tokens: 12000, messages: [{role: "user", content: [...imgs.map(d => ({type: "image", source: {type: "base64", media_type: "image/jpeg", data: d}})), {type: "text", text: prompt}]}]})});
        j = await r.json().catch(() => ({}));
        if (!r.ok) throw httpErr(r.status, j.error && j.error.message);
        return (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");
      }
      throw {code: "not_granted"};
    } catch(e){
      if (e && e.name === "AbortError") throw {code: "cancelled"};
      if (e && e.code) throw e;
      throw {code: "network", message: String(e && e.message || e)};
    }
  }
  function parseJSON(t){
    t = String(t || "").trim();
    try { return JSON.parse(t); } catch(e){}
    const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch(e){} }
    for (const [a, b] of [["{", "}"], ["[", "]"]]){ const i = t.indexOf(a), k = t.lastIndexOf(b); if (i >= 0 && k > i){ try { return JSON.parse(t.slice(i, k + 1)); } catch(e){} } }
    throw {code: "invalid_json", text: t};
  }
  const SAMPLE = async (input, opts) => ({text: await ask(typeof input === "string" ? input : input.map(m => m.content).join("\n\n"), opts && opts.images, opts && opts.signal), truncated: false});
  SAMPLE.json = async (input, opts) => parseJSON((await SAMPLE(input, opts)).text);
  SAMPLE.limits = async () => ({maxPromptBytes: 262144, images: {maxCount: 5, maxInputBytes: 20e6, mediaTypes: ["image/jpeg","image/png","image/webp"]}});
  window.__sample = SAMPLE;

  /* ---- Guardar y compartir archivos ---- */
  const DOWNLOADS = {
    async save({filename, data}){
      const type = filename.endsWith(".json") ? "application/json" : filename.endsWith(".html") ? "text/html" : "text/plain";
      const blob = data instanceof Blob ? data : new Blob([data], {type});
      try {
        const file = new File([blob], filename, {type});
        if (navigator.canShare && navigator.canShare({files: [file]})){
          try { await navigator.share({files: [file], title: filename}); return {status: "saved"}; }
          catch(e){ if (e && e.name === "AbortError") throw {code: "declined"}; }
        }
      } catch(e){ if (e && e.code) throw e; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return {status: "saved"};
    }
  };

  /* ---- Sincronización con Dropbox ---- */
  const SKEY = "recetario-sync" + (window.__dbName ? "-" + window.__dbName : "");
  const sget = () => { try { return JSON.parse(lsGet(SKEY, "{}")) || {}; } catch(e){ return {}; } };
  const sset = o => lsSet(SKEY, JSON.stringify(o));
  const redirectURI = () => location.origin + location.pathname;
  const hdrArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
  function normPath(p){ p = String(p || "").trim().replace(/\\/g, "/").replace(/\/+$/, ""); if (!p) p = "/Recetario"; if (!p.startsWith("/")) p = "/" + p; return p; }
  function b64url(buf){ let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  const DBX = {
    async connect(appKey, path){
      const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
      const c = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)));
      const state = rid(16);
      sset({prov: "dropbox", appKey, path: normPath(path), verifier: v, state});
      location.href = "https://www.dropbox.com/oauth2/authorize?" + new URLSearchParams({client_id: appKey, response_type: "code", code_challenge: c, code_challenge_method: "S256", redirect_uri: redirectURI(), token_access_type: "offline", state}).toString();
    },
    async finish(){
      const qp = new URLSearchParams(location.search);
      const code = qp.get("code"), state = qp.get("state"), err = qp.get("error");
      if (!code && !err) return false;
      const s = sget();
      history.replaceState(null, "", location.pathname);
      if (err || !s.verifier || state !== s.state){ SYNC.setStatus({state: "error", msg: err ? "Has cancelado la conexión con Dropbox." : "No se pudo completar la conexión con Dropbox. Vuelve a intentarlo."}); return true; }
      try {
        const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method: "POST", body: new URLSearchParams({code, grant_type: "authorization_code", code_verifier: s.verifier, client_id: s.appKey, redirect_uri: redirectURI()})});
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.refresh_token) throw new Error(j.error_description || j.error || ("HTTP " + r.status));
        sset({prov: "dropbox", appKey: s.appKey, path: s.path, refresh: j.refresh_token, access: j.access_token, exp: Date.now() + ((j.expires_in || 14400) - 120) * 1000, subidas: []});
        SYNC.justConnected = true;
      } catch(e){ sset({}); SYNC.setStatus({state: "error", msg: "Dropbox no aceptó la conexión: " + e.message}); }
      return true;
    },
    async token(force){
      const s = sget(); if (!s.refresh) throw {code: "auth"};
      if (!force && s.access && s.exp > Date.now()) return s.access;
      const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method: "POST", body: new URLSearchParams({grant_type: "refresh_token", refresh_token: s.refresh, client_id: s.appKey})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ if (r.status === 400 || r.status === 401) throw {code: "auth", message: j.error_description}; throw {code: "network"}; }
      sset({...sget(), access: j.access_token, exp: Date.now() + ((j.expires_in || 14400) - 120) * 1000});
      return j.access_token;
    },
    async call(url, arg, body, retry){
      const headers = {"Authorization": "Bearer " + await this.token(), "Dropbox-API-Arg": hdrArg(arg)};
      if (body !== undefined) headers["Content-Type"] = "application/octet-stream";
      const r = await fetch(url, {method: "POST", headers, body});
      if (r.status === 401 && retry !== false){ await this.token(true); return this.call(url, arg, body, false); }
      return r;
    },
    async download(path){
      const r = await this.call("https://content.dropboxapi.com/2/files/download", {path});
      if (r.status === 409){ const t = await r.text(); if (/not_found/.test(t)) return null; throw {code: "dropbox", message: t}; }
      if (!r.ok) throw {code: r.status === 429 ? "rate_limited" : "dropbox", message: (await r.text()).slice(0, 200)};
      let rev = null; try { rev = JSON.parse(r.headers.get("Dropbox-API-Result")).rev; } catch(e){}
      return {blob: await r.blob(), rev};
    },
    async upload(path, blob, rev){
      const mode = rev ? {".tag": "update", "update": rev} : {".tag": "add"};
      const r = await this.call("https://content.dropboxapi.com/2/files/upload", {path, mode, autorename: false, mute: true}, blob);
      if (r.status === 409){ const t = await r.text(); if (/conflict/.test(t)) throw {code: "conflict"}; throw {code: "dropbox", message: t.slice(0, 200)}; }
      if (!r.ok) throw {code: r.status === 429 ? "rate_limited" : "dropbox", message: (await r.text()).slice(0, 200)};
      return (await r.json()).rev;
    }
  };
  /* ---- Carpeta del móvil (Chrome en Android y ordenadores) ---- */
  const DIRKEY = "__meta/dir";
  let dirHandle = null;
  async function fsPerm(ask){
    if (!dirHandle) return false;
    const o = {mode: "readwrite"};
    try { if ((await dirHandle.queryPermission(o)) === "granted") return true; if (ask) return (await dirHandle.requestPermission(o)) === "granted"; } catch(e){}
    return false;
  }
  async function walk(path, create){
    const parts = path.replace(/^\/+/, "").split("/").filter(Boolean);
    let d = dirHandle;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, {create});
    return {d, name: parts[parts.length - 1]};
  }
  const stamp = f => f.lastModified + ":" + f.size;
  const FOLDER = {
    async download(path){
      if (!(await fsPerm(false))) throw {code: "perm"};
      try {
        const {d, name} = await walk(path, false);
        const f = await (await d.getFileHandle(name)).getFile();
        return {blob: new Blob([await f.arrayBuffer()], {type: f.type || "application/octet-stream"}), rev: stamp(f)};
      } catch(e){ if (e && (e.name === "NotFoundError" || e.name === "TypeMismatchError")) return null; throw e; }
    },
    async upload(path, blob, rev){
      if (!(await fsPerm(false))) throw {code: "perm"};
      const {d, name} = await walk(path, true);
      let fh = null; try { fh = await d.getFileHandle(name); } catch(e){}
      if (fh){ if (!rev || stamp(await fh.getFile()) !== rev) throw {code: "conflict"}; }
      else fh = await d.getFileHandle(name, {create: true});
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      return stamp(await fh.getFile());

      return u.length ? u : detectUtens([r.titulo, ...pasos.map(x => x.texto)].join(" ")); })(),
    ingredientes: ings, pasos,
    fuente: {tipo: str(f.tipo) || "propia", url: str(f.url) || null, autor: str(f.autor) || null},
    notas: str(r.notas),
    nuestraVersion: str(r.nuestraVersion || r.nuestra_version),
    estado: r.estado === "probada" ? "probada" : "por_probar",
    foto_data: foto
  };
}
function exportable(r){
  return {
    titulo:r.titulo, descripcion:r.descripcion||"", raciones:r.raciones??null, tiempos:r.tiempos||{},
    dificultad:r.dificultad||null, categoria:r.categoria||null, etiquetas:r.etiquetas||[], cocina:r.cocina||null, utensilios:r.utensilios||[],
    ingredientes:r.ingredientes||[], pasos:(r.pasos||[]).map(p => ({texto:p.texto, temporizador_min:p.temporizador_min ?? null})), fuente:r.fuente||{tipo:"propia",url:null,autor:null},
    notas:r.notas||"", nuestraVersion:r.nuestraVersion||"",
    estado:r.estado||"por_probar", valoracion_media: avgRating(r)
  };
}
function extractJSON(text){
  text = String(text||"").trim();
  let fotosHTML = null;
  if (text.startsWith("<")){
    const doc = new DOMParser().parseFromString(text, "text/html");
    const s = doc.getElementById("recetario-datos");
    if (!s) throw new Error("Ese archivo HTML no lleva recetas dentro.");
    fotosHTML = {};
    doc.querySelectorAll("img[data-foto]").forEach(img => { fotosHTML[img.dataset.foto] = img.getAttribute("src"); });
    doc.querySelectorAll("img[data-paso-foto]").forEach(img => { fotosHTML["p" + img.dataset.pasoFoto] = img.getAttribute("src"); });
    text = s.textContent;
  }
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) text = fence[1];
  let obj = null;
  try { obj = JSON.parse(text); } catch(e){
    const a = text.indexOf("{"), b = text.lastIndexOf("}");
    if (a >= 0 && b > a) { try { obj = JSON.parse(text.slice(a, b+1)); } catch(e2){} }
    if (!obj){ const a2 = text.indexOf("["), b2 = text.lastIndexOf("]"); if (a2 >= 0 && b2 > a2) { try { obj = JSON.parse(text.slice(a2, b2+1)); } catch(e3){} } }
  }
  if (!obj) throw new Error("No encuentro un JSON válido. Copia la respuesta completa de la IA, incluidas las llaves { }.");
  let list;
  if (Array.isArray(obj)) list = obj;
  else if (obj && Array.isArray(obj.recetas)) list = obj.recetas;
  else if (obj && obj.titulo) list = [obj];
  else throw new Error("El JSON no tiene recetas en el formato recetario-v1.");
  if (fotosHTML) list = list.map((r,i) => ({...r, foto_data: fotosHTML[i] || r.foto_data,
    pasos: Array.isArray(r.pasos) ? r.pasos.map((ps,j) => fotosHTML["p"+i+"-"+j] && ps && typeof ps === "object" ? {...ps, foto_data: fotosHTML["p"+i+"-"+j]} : ps) : r.pasos}));
  return list.map(normReceta);
}

/* ---------- Imágenes ---------- */
async function compressImage(file, max=1600, q=0.82){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", q));
  } catch(e){ return file; }
}
function blobToDataURL(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }
async function assetToDataURL(id, max=900, q=0.72){
  try { const r = await fetch(blobUrl(id)); if (!r.ok) return null; const b = await compressImage(await r.blob(), max, q); return await blobToDataURL(b); }
  catch(e){ return null; }
}
async function dataURLToBlob(d){ const r = await fetch(d); return await r.blob(); }
async function uploadImage(fileOrBlob){
  if (!S.assets) throw new Error("Solo quien puede editar el recetario sube fotos.");
  const b = await compressImage(fileOrBlob);
  const res = await S.assets.upload(b, {type:"image/jpeg"});
  return res.id;
}

async function createRecipe(r, fotos){
  const now = new Date().toISOString();
  const {foto_data, ...rest} = r;
  rest.pasos = (rest.pasos || []).map(({foto_data: _f, ...ps}) => ps);
  const body = {...rest, fotos: fotos || [], favorita: false, valoraciones: {},
    probadaEn: r.estado === "probada" ? today() : null, creadaEn: now, actualizadaEn: now, creadaPor: S.uid || null};
  const ref = S.db.collection("recetas").doc();
  await ref.set(JSON.parse(JSON.stringify(body)));
  return ref.id;
}
async function updateRecipe(id, patch){
  await S.db.doc("recetas/"+id).update(JSON.parse(JSON.stringify({...patch, actualizadaEn: new Date().toISOString()})));
}
function dbErr(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "El recetario está lleno. Borra recetas que no uses para hacer sitio.";
  if (c === "invalid_argument") return "No tienes permiso para cambiar el recetario.";
  if (c === "resource_exhausted") return "Demasiados cambios seguidos. Espera unos segundos.";
  return "No se pudo guardar. Comprueba la conexión e inténtalo otra vez.";
}

function matches(r, q){
  if (!q) return true;
  const terms = deacc(q.toLowerCase()).split(/[,\s]+/).filter(t => t.length > 1);
  if (!terms.length) return true;
  const hay = deacc([r.titulo, r.descripcion, (r.etiquetas||[]).join(" "), (r.ingredientes||[]).map(i=>i.nombre).join(" "), CATS[r.categoria]||"", r.cocina||"", (r.utensilios||[]).join(" ")].join(" ").toLowerCase());
  return terms.every(t => hay.includes(t));
}
function filtered(){
  let list = S.recetas.filter(r => matches(r, S.q) && (!S.cat || r.categoria === S.cat) && (!S.fCocina || r.cocina === S.fCocina) && (!S.fUtens || (r.utensilios||[]).includes(S.fUtens)));
  const counts = {todas:list.length, probadas:list.filter(r=>r.estado==="probada").length, por_probar:list.filter(r=>r.estado!=="probada").length, favoritas:list.filter(r=>r.favorita).length};
  if (S.tab === "probadas") list = list.filter(r => r.estado === "probada");
  else if (S.tab === "por_probar") list = list.filter(r => r.estado !== "probada");
  else if (S.tab === "favoritas") list = list.filter(r => r.favorita);
  const by = {
    recientes: (a,b) => String(b.actualizadaEn||"").localeCompare(String(a.actualizadaEn||"")),
    valoradas: (a,b) => (avgRating(b)??-1) - (avgRating(a)??-1),
    rapidas: (a,b) => (totalMin(a)||9999) - (totalMin(b)||9999),
    alfabetico: (a,b) => a.titulo.localeCompare(b.titulo, "es")
  }[S.sort];
  list.sort(by);
  return {list, counts};
}

  if (!ids.length){ box.innerHTML = `<p class="small muted" style="margin:0">Aún nadie le ha puesto nota.</p>`; return; }

  box.innerHTML = "";
  ids.forEach(id => {

    const row = document.createElement("div"); row.className = "vote";
    if (p.avatarUrl){ const img = document.createElement("img"); img.src = p.avatarUrl; img.alt = ""; row.append(img); }

function aiPrompt(text, url, nImg){
  return `Eres el asistente de un recetario familiar español. Convierte el material que te doy en una receta estructurada.
El material puede ser texto pegado de una web o de Instagram, un dictado hablado (desordenado, con muletillas) o ${nImg ? `${nImg} imagen(es) adjunta(s): capturas, fotos de un libro, de una nota en papel o del plato` : "texto"}.

Responde SOLO con JSON con esta estructura:
${SCHEMA}

Reglas:
${RULES}
- Si el material contiene varias recetas distintas, devuelve varias en "recetas".
- Ordena el dictado en pasos lógicos, sin añadir ingredientes ni cantidades que no se mencionen.
- Medidas caseras sin peso ("un vaso", "la medida del yogur"): cantidad en número y la medida en "unidad" tal cual (p. ej. "vaso de yogur").
- Si no se indica la fuente, usa "propia"${url ? `; el enlace de origen es ${url}` : ""}.
- Añade a cada receta el campo "foto_plato": el índice (empezando en 0) de la imagen que muestra el plato terminado, o null si ninguna lo muestra. Las capturas de texto no cuentan.
- No hagas preguntas: si falta un dato, pon null.

MATERIAL:
${text ? text.slice(0, 40000) : "(solo imágenes)"}`;
}
async function runAI(sh){
  const text = $("#ai-text", sh).value.trim();
  const url = ($("#ai-url", sh).value || "").trim();
  const fileInput = $("#ai-files", sh);
  const files = fileInput ? Array.from(fileInput.files).slice(0, S.maxImages) : [];
  const st = $("#ai-status", sh), goBtn = $("#ai-go", sh);
  const onlyLinks = /^\s*(https?:\/\/\S+\s*)+$/.test(text);
  if ((!text || onlyLinks) && !files.length){
    st.innerHTML = url || onlyLinks
      ? `<p class="err">Instagram y TikTok no dejan leer la receta solo con el enlace. Pega el texto del post, sube una captura o pulsa «Guardar enlace para después».</p>`
      : `<p class="err">Pega o dicta la receta, o elige alguna foto.</p>`;
    return;
  }
  const ctl = new AbortController(); S.aiCtl = ctl;
  goBtn.disabled = true;
  st.innerHTML = `<div class="status"><span class="spin"></span><span id="ai-msg">La IA está leyendo la receta…</span><span style="flex:1"></span><button class="textbtn" id="ai-stop">Parar</button></div>`;
  $("#ai-stop", sh).onclick = () => ctl.abort();
  try {
    const opts = {signal: ctl.signal};
    if (files.length) opts.images = files;
    const out = await S.sample.json(aiPrompt(text, url, files.length), opts);
    const raw = out && Array.isArray(out.recetas) ? out.recetas : Array.isArray(out) ? out : [out];
    const recs = raw.map(x => ({rec: normReceta(x), foto: Number.isInteger(x && x.foto_plato) ? x.foto_plato : null}));
    if (!recs.length || !recs[0].rec.titulo) throw {code:"invalid_json"};
    if (url) recs.forEach(o => { if (!o.rec.fuente.url) o.rec.fuente.url = url; if (o.rec.fuente.tipo === "propia") o.rec.fuente.tipo = /instagram/.test(url) ? "instagram" : /tiktok/.test(url) ? "tiktok" : /youtu/.test(url) ? "youtube" : "web"; });
    S.aiCtl = null;
    if (recs.length > 1){
      $("#ai-msg", sh).textContent = `Guardando ${recs.length} recetas…`;
      for (const o of recs){
        let fotos = [];
        if (o.foto != null && files[o.foto] && S.assets){ try { fotos = [await uploadImage(files[o.foto])]; } catch(e){} }
        await createRecipe(o.rec, fotos);
      }
      closeSheet(); toast(`${recs.length} recetas añadidas a Por probar`); S.tab = "por_probar"; go("list");
      return;
    }
    const o = recs[0]; let fotos = [];
    if (o.foto != null && files[o.foto] && S.assets){ $("#ai-msg", sh).textContent = "Subiendo la foto del plato…"; try { fotos = [await uploadImage(files[o.foto])]; } catch(e){} }
    closeSheet();
    openEditor({...o.rec, fotos}, true);
    toast("Revisa la receta y guárdala");
  } catch(e){
    S.aiCtl = null; goBtn.disabled = false;
    const c = e && e.code;
    if (c === "cancelled"){ st.innerHTML = ""; return; }
    const msg = {
      not_granted: "Configura una IA en Ajustes o escribe la receta a mano.",
      sampling_disabled: "Configura una IA en Ajustes.",
      rate_limited: "Has hecho muchas peticiones seguidas o has llegado a tu límite de uso. Prueba dentro de un rato.",
      image_rejected: "Alguna imagen no se puede leer. Prueba con otra foto o captura.",
      images_unavailable: "Desde aquí no se pueden enviar imágenes. Pega el texto.",
      invalid_json: "La IA no ha devuelto una receta clara. Prueba con más texto o una captura más nítida.",
      refused: "La IA no ha podido procesar ese contenido.",
      prompt_too_large: "El texto es demasiado largo. Pega solo la receta.",
      session_expired: "Vuelve a intentarlo."
    }[c] || aiErrMsg(e);
    st.innerHTML = `<p class="err">${esc(msg)}</p>`;
  }
}

function tipoFromUrl(u){ return /instagram/.test(u) ? "instagram" : /tiktok/.test(u) ? "tiktok" : /youtu/.test(u) ? "youtube" : u ? "web" : "propia"; }
function linksFrom(...t){ return [...new Set((t.join(" ").match(/https?:\/\/[^\s<>"']+/g) || []).map(x => x.replace(/[),.;]+$/, "")))]; }
async function saveLinks(){
  const t = ($("#ai-text") && $("#ai-text").value) || "", u = ($("#ai-url") && $("#ai-url").value) || "";
  const links = linksFrom(u, t);
  if (!links.length){ toast("Pega primero el enlace"); return; }
  if (links.length === 1){
    const notas = t.replace(links[0], "").trim();
    closeSheet(); openEditor(normReceta({titulo: "", notas, fuente: {tipo: tipoFromUrl(links[0]), url: links[0]}}), true);
    toast("Ponle un título y guárdala"); return;
  }
  closeSheet(); toast(`Guardando ${links.length} enlaces…`);
  try {
    let n = 0;
    for (const l of links){
      let host = "web"; try { host = new URL(l).hostname.replace(/^www\./, ""); } catch(e){}
      await createRecipe({...normReceta({titulo: `Pendiente ${++n} · ${host}`, fuente: {tipo: tipoFromUrl(l), url: l}}), estado: "por_probar"}, []);
    }
    toast(`${links.length} enlaces guardados en «Por probar»`); S.tab = "por_probar"; go("list");
  } catch(e){ toast(dbErr(e)); }
}

function readImport(sh){
  const out = $("#imp-out", sh);
  let recs;
  const raw = S.impRaw || $("#imp-text", sh).value;
  try { const o = JSON.parse(raw); if (o && o.formato === "recetario-copia-v1") return mergePreview(sh, o); } catch(e){}
  try { recs = extractJSON(raw); }
  catch(e){ out.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (!recs.length){ out.innerHTML = `<p class="err">No hay recetas en ese contenido.</p>`; return; }
  const existing = new Set(S.recetas.map(r => deacc(r.titulo.toLowerCase())));
  out.innerHTML = `<span class="lbl">${recs.length} ${recs.length===1?"receta encontrada":"recetas encontradas"}</span>
    <ul class="prev">${recs.map((r,i) => { const dup = existing.has(deacc(r.titulo.toLowerCase())); return `<li><label><input type="checkbox" id="imp-${i}" data-i="${i}"${dup?"":" checked"}><span><b>${esc(r.titulo)}</b><br><span class="small muted">${r.ingredientes.length} ingredientes · ${r.pasos.length} pasos${r.foto_data?" · con foto":""}</span>${dup?`<br><span class="warn">Ya tienes una receta con este nombre</span>`:""}</span></label></li>`; }).join("")}</ul>
    <button class="btn primary block" id="imp-save" style="margin-top:10px">Añadir a "Por probar"</button>`;
  $("#imp-save", sh).onclick = async () => {
    const chosen = $$(".prev input", sh).filter(c => c.checked).map(c => recs[+c.dataset.i]);
    if (!chosen.length){ toast("Marca al menos una receta"); return; }
    const btn = $("#imp-save", sh); btn.disabled = true;
    try {
      let n = 0;
      for (const r of chosen){
        btn.textContent = `Guardando ${++n} de ${chosen.length}…`;
        let fotos = [];
        if (r.foto_data && S.assets){ try { fotos = [await uploadImage(await dataURLToBlob(r.foto_data))]; } catch(e){} }
        const pasos = [];
        for (const ps of r.pasos){ const {foto_data, ...q} = ps; if (foto_data && S.assets){ try { q.foto = await uploadImage(await dataURLToBlob(foto_data)); } catch(e){} } pasos.push(q); }
        await createRecipe({...r, pasos, estado:"por_probar"}, fotos);
      }
      closeSheet(); toast(`${chosen.length} ${chosen.length===1?"receta importada":"recetas importadas"}`);
      S.tab = "por_probar"; go("list");
    } catch(e){ btn.disabled = false; btn.textContent = `Añadir a "Por probar"`; out.insertAdjacentHTML("beforeend", `<p class="err">${esc(dbErr(e))}</p>`); }
  };
}

function collectDraft(){
  const g = id => ($("#"+id)?.value || "").trim();

  $$("#ing-list > .irow").forEach(row => {
    if (row.dataset.kind === "grupo"){ grupo = row.querySelector("input").value.trim() || null; return; }
    const nombre = $(".i-nombre", row).value.trim(); if (!nombre) return;
    ingredientes.push({grupo, cantidad: num($(".i-cant", row).value), unidad: $(".i-unid", row).value.trim(), nombre, nota: $(".i-nota", row).value.trim()});
  });
  const pasos = $$("#step-list > .prow").map(row => ({texto: $("textarea", row).value.trim(), temporizador_min: num($(".tmin input", row).value), foto: row.dataset.foto || null})).filter(p => p.texto);
  return {
    titulo: g("e-titulo"), descripcion: g("e-desc"), categoria: g("e-cat") || null, dificultad: g("e-dif") || null,
    raciones: num(g("e-rac")), etiquetas: g("e-tags").split(",").map(s=>s.trim()).filter(Boolean),
    tiempos: {preparacion_min: num(g("e-prep")), coccion_min: num(g("e-coc")), reposo_min: num(g("e-rep"))},
    ingredientes, pasos, notas: g("e-notas"), nuestraVersion: g("e-nv"),
    cocina: g("e-cocina") || null, utensilios: [...S.draft.utensilios],
    fuente: {tipo: g("e-ftipo") || "propia", url: g("e-furl") || null, autor: g("e-fautor") || null},

async function saveDraft(){
  const d = collectDraft(), err = $("#e-err"), btn = $("#e-save");

  btn.disabled = true; btn.textContent = "Guardando…"; err.hidden = true;
  try {
    let id = S.draft.id;
    if (!id){ id = await createRecipe(d, d.fotos); }
    else {
      const prev = getR(id) || {};
      const patch = {...d};
      if (d.estado === "probada" && !prev.probadaEn) patch.probadaEn = today();
      await S.db.doc("recetas/"+id).set(JSON.parse(JSON.stringify({...prev, ...patch, id: undefined, actualizadaEn: new Date().toISOString()})));
    }
    if (S.assets) for (const a of S.draft.removed) { try { await S.assets.delete(a); } catch(e){} }

/* ---------- Modo cocina ---------- */
function openCook(){
  S.cookOpen = true; S.cookStep = 0; renderCook();
  try { navigator.wakeLock?.request("screen").then(l => { S.wakeLock = l; }).catch(()=>{}); } catch(e){}
}
function closeCook(){ S.cookOpen = false; S.cookIngs = false; $("#cook")?.remove(); try { S.wakeLock?.release(); } catch(e){} S.wakeLock = null; if (S.view === "detail") render(); }
function renderCook(){
  const r = getR(S.currentId); if (!r){ closeCook(); return; }
  const pasos = r.pasos || []; const n = pasos.length;
  let el = $("#cook");
  if (!el){ el = document.createElement("div"); el.id = "cook"; el.className = "cook"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.append(el); }
  const i = Math.min(S.cookStep, n); // n = pantalla final
  let body;
  if (S.cookIngs){
    body = `<h2>Ingredientes · ${r.raciones ? fmtQty(servingsFor(r))+" raciones" : "× "+fmtQty(servingsFor(r))}</h2><ul class="ings cings">${ingsHTML(r, true, "cc")}</ul>`;
  } else if (i >= n){
    body = `<span class="num">Terminado</span><p class="txt">¡Que aproveche!</p>${r.estado !== "probada" && S.canWrite ? `<button class="btn ok" data-act="markTried">La hemos probado</button>` : ""}`;
  } else {
    const p = pasos[i], tm = stepTimer(p);
    body = `<span class="num">Paso ${i+1} de ${n}</span><p class="txt">${esc(p.texto)}</p>${tm ? `<button class="tchip" style="font-size:1rem;padding:8px 16px;align-self:flex-start" data-act="timer" data-min="${tm}" data-label="Paso ${i+1}">${ICON.clock}Temporizador ${fmtMin(tm)}</button>` : ""}${stepMedia(p)}`;
  }
  el.innerHTML = `<div class="ctop"><button class="iconbtn" data-act="closeCook" aria-label="Salir del modo cocina">${ICON.close}</button><h2>${esc(r.titulo)}</h2>
      <button class="iconbtn" data-act="cookIngs" aria-pressed="${!!S.cookIngs}" aria-label="Ver ingredientes">${ICON.list}</button></div>
    <div class="prog"><i style="width:${n ? Math.round(Math.min(i,n)/n*100) : 0}%"></i></div>
    <div class="cbody">${body}
    <div class="cnav"><button class="btn" data-act="cookPrev"${i===0 && !S.cookIngs?" disabled":""}>Anterior</button><button class="btn primary" data-act="cookNext"${i>=n && !S.cookIngs?" disabled":""}>${S.cookIngs ? "Volver al paso" : i >= n-1 ? "Terminar" : "Siguiente"}</button></div></div>`;
}

/* ---------- Temporizadores ---------- */
function startTimer(min, label){
  try { if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)(); S.audio.resume?.(); } catch(e){}
  S.timers.push({id: Date.now()+Math.random(), label, end: Date.now() + min*60000, done: false});
  renderTimers();
  if (!S.tick) S.tick = setInterval(tickTimers, 1000);
  toast(`Temporizador de ${fmtMin(min)} en marcha`);
}
function beep(){
  try { const a = S.audio; if (!a) return; [0, .45, .9].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.0001, a.currentTime+t); g.gain.exponentialRampToValueAtTime(.4, a.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+t+.35); o.start(a.currentTime+t); o.stop(a.currentTime+t+.4); }); } catch(e){}
  try { navigator.vibrate?.([300,150,300,150,300]); } catch(e){}
}
function tickTimers(){
  const now = Date.now();
  S.timers.forEach(t => { if (!t.done && now >= t.end){ t.done = true; beep(); t.lastBeep = now; } else if (t.done && now - (t.lastBeep||0) > 8000){ beep(); t.lastBeep = now; } });
  if (!S.timers.length){ clearInterval(S.tick); S.tick = null; }
  renderTimers();
}
function renderTimers(){
  $("#timers").innerHTML = S.timers.map(t => {
    const left = Math.max(0, Math.round((t.end - Date.now())/1000));
    const mm = String(Math.floor(left/60)).padStart(2,"0"), ss = String(left%60).padStart(2,"0");
    return `<div class="timer${t.done?" done":""}" role="timer"><b>${t.done ? "¡Listo!" : mm+":"+ss}</b><span>${esc(t.label)}</span><button data-act="stopTimer" data-id="${t.id}">${t.done ? "Parar" : "Quitar"}</button></div>`;
  }).join("");
}

function recipeText(r){

  const lines = [r.titulo.toUpperCase()];

  if (r.raciones) meta.push(`${fmtQty(servingsFor(r))} raciones`);
  if (totalMin(r)) meta.push(`Tiempo total: ${fmtMin(totalMin(r))}`);
  if (meta.length) lines.push(meta.join(" · "));
  lines.push("", "INGREDIENTES"); let last = null;
  (r.ingredientes||[]).forEach(i => { if (i.grupo && i.grupo !== last) lines.push(`${i.grupo}:`); last = i.grupo; const {qty,name} = ingLine(i, f); lines.push(`- ${qty ? qty+" " : ""}${name}`); });

async function saveFile(filename, data){
  if (S.downloads){
    try { await S.downloads.save({filename, data}); toast("Archivo listo"); return; }
    catch(e){ if (e && e.code === "declined") return; if (e && !["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)) { toast("No se pudo guardar el archivo"); return; } }
  }
  const isJSON = filename.endsWith(".json");
  openSheet(`<h2>Copia el contenido</h2><p class="hint">Desde aquí no se puede descargar el archivo. Copia el ${isJSON ? "JSON" : "HTML"} y pégalo donde lo necesites.</p>
    <textarea id="fb-text" rows="8" readonly style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);font-size:.8rem">${esc(data)}</textarea>
    <button class="btn primary block" id="fb-copy">Copiar</button>`, sh => { $("#fb-copy", sh).onclick = () => copyText(data, $("#fb-text", sh)); });
}
async function doExport(list, fmt, title){
  if (!list.length){ toast("No hay recetas que exportar"); return; }
  closeSheet(); toast("Preparando el archivo…");
  const many = list.length > 1;
  const items = [];
  for (const r of list){
    const foto = r.fotos && r.fotos[0] ? await assetToDataURL(r.fotos[0], many ? 700 : 1000, many ? .66 : .74) : null;
    const pf = {};
    if (list.length <= 10) for (const [j, ps] of (r.pasos||[]).entries()) if (ps.foto) pf[j] = await assetToDataURL(ps.foto, 700, .66);
    items.push({r, foto, pf});
  }
  const base = slug(title);
  if (fmt === "json"){
    const data = {formato:"recetario-v1", exportado:new Date().toISOString(), origen:"Recetario da Casa", recetas: items.map(({r,foto,pf}) => { const e = exportable(r); e.pasos = e.pasos.map((ps,j) => pf[j] ? {...ps, foto_data: pf[j]} : ps); return {...e, foto_data: foto}; })};
    await saveFile(base + ".json", JSON.stringify(data, null, 2));
  } else {
    await saveFile(base + ".html", exportDocHTML(items, title));
  }
}

const KW = [
  ["pescado", /merluza|bacalao|salmon|atun|bonito|sardin|caballa|rape|lubina|dorada|gamba|langostin|mejillon|almeja|zamburi|vieira|calamar|pulpo|sepia|chipir|pescad|marisco|berberecho|navaja|rodaballo|jurel|xouba|anchoa|boqueron|trucha|lenguado|abadejo|congrio|caldeirada/],
  ["legumbre", /garbanzo|lenteja|alubia|judia (blanca|pinta|roja)|fabes|faba|habas|soja|hummus|cocido/],
  ["carne_roja", /ternera|cerdo|cordero|buey|chorizo|lomo|costilla|carne picada|jamon|panceta|cabrito|raxo|zorza|lacon|chuleta|solomillo|hamburguesa|salchicha|morcilla|carrillera|rabo/],
  ["carne_blanca", /pollo|pavo|conejo|pechuga|muslo/],
  ["huevo", /tortilla|huevo|revuelto|frittata|quiche/],
  ["cereal", /arroz|risotto|paella|pasta|macarr|espagueti|spaghetti|fideo|fideua|lasana|quinoa|cuscus|noqui|canelon|pizza/]
];
function grupoDe(r, def){
  const t = deacc((r.titulo||"").toLowerCase());
  for (const [g, re] of KW) if (re.test(t)) return g;
  const ing = deacc((r.ingredientes||[]).map(i=>i.nombre).join(" ").toLowerCase());
  for (const [g, re] of KW) if (g !== "huevo" && re.test(ing)) return g;
  return def || "verdura";
}
function isoLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso, n){ const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoLocal(d); }
function nextMonday(){ const d = new Date(); d.setHours(12,0,0,0); const wd = (d.getDay()+6)%7; if (wd) d.setDate(d.getDate()+7-wd); return isoLocal(d); }
function fmtDay(iso){ try { return new Date(iso+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"}); } catch(e){ return iso; } }
const BATCH_DIAS = [[-1,"Domingo antes de empezar"],[-2,"Sábado antes de empezar"],[0,"Lunes"],[2,"Miércoles"],[3,"Jueves"]];
const LIBRE = () => ({tipo:"libre", receta_id:null, titulo:"Libre", grupo:null, batch:false, nota:""});
const MEALS = ["comida","cena"];
function defaultCfg(){ return {inicio: nextMonday(), personas: 4, slots: DIAS.map(()=>({comida:4, cena:4})), nuevas: 1, batch: true, batchDia: -1, batchHoras: 2, preferencias: "", ideas: true, nevera: "", congelador: ""}; }
function normSlots(slots, per){
  if (!Array.isArray(slots) || slots.length !== 7) return DIAS.map(() => ({comida: per, cena: per}));
  const v = x => x === true ? per : x === false || x == null ? 0 : Math.max(0, Math.min(30, parseInt(x, 10) || 0));
  return slots.map(s => ({comida: v(s && s.comida), cena: v(s && s.cena)}));
}
function batchLabel(cfg){
  cfg = cfg || defaultCfg();
  const d = addDays(cfg.inicio, cfg.batchDia ?? -1);
  const t = new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function menuCands(){ return S.recetas.filter(r => !["postre","salsa","bebida"].includes(r.categoria)); }
let menuQ = Promise.resolve();
function menuPatch(patch){
  menuQ = menuQ.then(() => S.db.doc("menus/actual").update(JSON.parse(JSON.stringify(patch)))).catch(e => toast(dbErr(e)));
  return menuQ;

/* Nevera y congelador */
const STOP = new Set(["del","las","los","con","para","sin","fresco","fresca","frescos","frescas","picado","picada","entero","entera","grande","grandes","pequeno","pequena","medio","media","natural","virgen","extra","taper","tapers","tupper","tuppers","racion","raciones","bolsa","bolsas","paquete","trozo","trozos","casero","casera","congelado","congelada","congelados","congeladas"]);
function sing(w){ return w.length > 4 && w.endsWith("es") ? w.slice(0,-2) : w.length > 3 && w.endsWith("s") ? w.slice(0,-1) : w; }
function words(t){ return deacc(String(t||"").toLowerCase()).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w) && !/^\d/.test(w)).map(sing); }
function wordSet(t){ return new Set(words(t)); }
function inSet(name, set){ const w = words(name); return w.length > 0 && w.every(x => set.has(x)); }
function freezerDishes(cfg, cands){
  const out = [];
  String(cfg.congelador||"").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).forEach(line => {
    const lw = wordSet(line);
    const rec = cands.find(r => inSet(r.titulo, lw));
    const isDish = rec || /t[aá]per|tupper|raci[oó]n|plato|hech[oa]s?\b|cocinad[oa]s?\b|guiso|croqueta|alb[oó]ndiga|lasa[nñ]a|canel[oó]n|empanada|cocido|potaje/i.test(line);
    if (!isDish) return;
    const m = line.match(/^\s*(\d+)/);
    const n = Math.min(3, m ? parseInt(m[1], 10) : 1);
    let t = line.replace(/^\s*\d+\s*/, "").replace(/^(t[aá]pers?|tuppers?|raci[oó]n(es)?|bolsas?)\s+(de\s+)?/i, "").trim();
    t = t.charAt(0).toUpperCase() + t.slice(1);
    for (let k = 0; k < n; k++) out.push({titulo: rec ? rec.titulo : t, receta_id: rec ? rec.id : null, grupo: rec ? grupoDe(rec) : grupoDe({titulo: t, ingredientes: []}, "otro")});
  });
  return out;
}

function menuPrompt(cfg, cands){

function cleanSlot(x, n){
  if (!x || typeof x !== "object") return null;
  let tipo = ["receta","sobras","congelado","idea","libre"].includes(x.tipo) ? x.tipo : "idea";
  let id = str(x.receta_id) || null;
  const r = id ? getR(id) : null;
  if ((tipo === "receta" || tipo === "sobras") && !r){ tipo = str(x.titulo) ? "idea" : "libre"; }
  if (!r || tipo === "idea" || tipo === "libre") id = null;
  if (tipo === "libre") return {...LIBRE(), titulo: str(x.titulo) || "Libre", nota: str(x.nota), personas: n};
  const grupo = GRUPOS[x.grupo] ? x.grupo : (r ? grupoDe(r) : "otro");
  return {tipo, receta_id: id, titulo: r && tipo !== "congelado" ? r.titulo : (str(x.titulo) || (r ? r.titulo : "")), grupo, batch: tipo === "congelado" ? false : !!x.batch, nota: str(x.nota), personas: n};
}
function cleanPlan(p, cfg){
  p = p && typeof p === "object" ? p : {};
  const src = Array.isArray(p.dias) ? p.dias : [];
  const dias = DIAS.map((_, i) => {
    const fecha = addDays(cfg.inicio, i);
    const d = src.find(x => x && x.fecha === fecha) || src[i] || {};
    const o = {fecha};
    MEALS.forEach(m => { const n = cfg.slots[i][m]; o[m] = n ? (cleanSlot(d[m], n) || {...LIBRE(), personas: n}) : null; });
    return o;
  });
  if (!dias.some(d => MEALS.some(m => d[m] && d[m].tipo !== "libre"))) throw {code: "invalid_json"};
  const pb = p.batch;
  const batch = cfg.batch && pb && typeof pb === "object" ? {
    tiempo_total_min: num(pb.tiempo_total_min),
    pasos: (Array.isArray(pb.pasos) ? pb.pasos : []).map(x => ({texto: str(x && x.texto), minutos: num(x && x.minutos), receta_ids: (Array.isArray(x && x.receta_ids) ? x.receta_ids : []).map(str).filter(id => getR(id))})).filter(x => x.texto),
    conservacion: (Array.isArray(pb.conservacion) ? pb.conservacion : []).map(str).filter(Boolean)
  } : null;
  const ideas = (Array.isArray(p.ideas_ingredientes) ? p.ideas_ingredientes : []).map(i => ({nombre: str(i && i.nombre), cantidad: num(i && i.cantidad), unidad: str(i && i.unidad)})).filter(i => i.nombre);
  return {inicio: cfg.inicio, dias, batch: batch && batch.pasos.length ? batch : null, ideas_ingredientes: ideas, equilibrio: str(p.equilibrio), generadoCon: "claude"};
}
function localPlan(cfg, cands){
  const counts = {legumbre:0, pescado:0, carne_blanca:0, carne_roja:0, huevo:0, cereal:0, verdura:0, otro:0};
  const used = {}, batchServ = {};
  let nuevas = cfg.nuevas, prevG = null;
  const fridge = wordSet(cfg.nevera);
  const info = cands.map(r => ({r, g: grupoDe(r), min: totalMin(r), nota: avgRating(r), usaNevera: (r.ingredientes||[]).some(i => inSet(i.nombre, fridge))}));
  const dias = DIAS.map((_, i) => ({fecha: addDays(cfg.inicio, i), comida: null, cena: null}));
  // Platos del congelador: a mitad de semana, cuando se acaba lo del batch
  const order = [];
  [3,4,2,5,1,6,0].forEach(i => order.push([i,"cena"]));
  [3,4,2,5,1,6,0].forEach(i => order.push([i,"comida"]));
  const free = order.filter(([i,m]) => cfg.slots[i][m]);
  freezerDishes(cfg, cands).forEach(fd => {
    const slot = free.shift(); if (!slot) return;
    const [i, m] = slot;
    dias[i][m] = {tipo: "congelado", receta_id: fd.receta_id, titulo: fd.titulo, grupo: fd.grupo, batch: false, nota: "Sacar del congelador la noche antes", personas: cfg.slots[i][m]};
  });
  dias.forEach((out, i) => {
    for (const m of MEALS){
      const n = cfg.slots[i][m];
      if (!n){ out[m] = null; continue; }
      if (out[m]){ counts[out[m].grupo] = (counts[out[m].grupo] || 0) + 1; prevG = out[m].grupo; continue; }
      let best = null, bs = -Infinity;
      for (const c of info){
        const nuevo = c.r.estado !== "probada";
        const carne = counts.carne_blanca + counts.carne_roja;
        let sc = nuevo ? (nuevas > 0 ? 2.6 : -6) : 2 + (c.nota || 3) / 2;
        sc -= (used[c.r.id] || 0) * 6;
        if (c.usaNevera) sc += i <= 2 ? 1.5 : 0.5;
        if (c.g === "legumbre") sc += counts.legumbre < 4 ? 2 : -1;
        if (c.g === "pescado") sc += counts.pescado < 3 ? 2 : -0.5;
        if (c.g === "carne_roja" || c.g === "carne_blanca") sc += carne >= 3 ? -5 : (c.g === "carne_roja" ? -0.5 : 0.3);
        if (c.g === "huevo" && counts.huevo >= 4) sc -= 5;
        if (m === "cena"){ if (["verdura","pescado","huevo"].includes(c.g)) sc += 1; if (c.min > 60) sc -= 1.5; if (c.g === "legumbre") sc -= 1; }
        else if (c.g === "legumbre" || c.g === "cereal") sc += 0.8;
        if (c.g === prevG) sc -= 1.5;
        sc += Math.random() * 0.8;
        if (sc > bs){ bs = sc; best = c; }
      }
      if (!best || bs < -1){ out[m] = {...LIBRE(), nota: "Faltan recetas: añade más al recetario", personas: n}; prevG = null; continue; }
      used[best.r.id] = (used[best.r.id] || 0) + 1;
      if (best.r.estado !== "probada") nuevas--;
      counts[best.g]++; prevG = best.g;
      const b = cfg.batchDia;
      const isBatch = cfg.batch && i >= Math.max(0, b) && i - b <= 3 && (best.min >= 25 || best.g === "legumbre") && !["pescado","huevo"].includes(best.g);
      if (isBatch) batchServ[best.r.id] = (batchServ[best.r.id] || 0) + n;
      out[m] = {tipo: "receta", receta_id: best.r.id, titulo: best.r.titulo, grupo: best.g, batch: isBatch, nota: best.r.estado !== "probada" ? "Receta nueva: después marcadla como probada" : (best.usaNevera && i <= 2 ? "Aprovecha lo que hay en la nevera" : ""), personas: n};
    }
  });
  let batch = null;
  const bIds = Object.keys(batchServ);
  if (cfg.batch && bIds.length){
    batch = {tiempo_total_min: null,
      pasos: [{texto: "Empieza por lo que más tarda (legumbres, guisos, horno) y, mientras, lava y corta las verduras de toda la tanda.", minutos: null, receta_ids: []}]
        .concat(bIds.map(id => { const r = getR(id); return {texto: `Prepara ${r.titulo}: ${batchServ[id]} raciones. Repártelo en tápers con el día escrito.`, minutos: totalMin(r) || null, receta_ids: [id]}; })),
      conservacion: ["Enfría rápido y guarda en la nevera en menos de 2 horas.", "En nevera, bien tapado, hasta 3-4 días.", "Lo que vayáis a comer más tarde, congélalo y pásalo a la nevera la noche anterior."]};
  }
  const carne = counts.carne_blanca + counts.carne_roja, falta = [], sobra = [];
  if (counts.legumbre < 4) falta.push("legumbres");
  if (counts.pescado < 3) falta.push("pescado");
  if (carne > 3) sobra.push("carne");
  if (counts.huevo > 4) sobra.push("huevo");
  const equilibrio = falta.length || sobra.length
    ? `${falta.length ? `Queda por debajo en ${falta.join(" y ")}. ` : ""}${sobra.length ? `Hay más ${sobra.join(" y ")} de lo aconsejado. ` : ""}${falta.length ? `Añadir recetas de ${falta.join(" y ")} al recetario ayudará a equilibrar la semana.` : ""}`
    : "La semana cumple las orientaciones de legumbres, pescado, carne y huevos.";
  return {inicio: cfg.inicio, dias, batch, ideas_ingredientes: [], equilibrio, generadoCon: "local"};
}

async function generateMenu(sh){
  const cfg = S.mcfg;
  cfg.inicio = $("#m-inicio", sh).value || nextMonday();
  cfg.personas = Math.max(1, Math.min(30, parseInt($("#m-pers", sh).value, 10) || 4));

  cfg.ideas = $("#m-ideas", sh).checked;
  const st = $("#m-status", sh), btn = $("#m-go", sh);
  if (!cfg.slots.some(x => x.comida || x.cena)){ st.innerHTML = `<p class="err">Pon personas en al menos una comida o cena.</p>`; return; }
  const cands = menuCands();
  if (!cands.length && !(S.sample && cfg.ideas) && !freezerDishes(cfg, cands).length){ st.innerHTML = `<p class="err">No hay recetas de platos que repartir. Añade alguna al recetario.</p>`; return; }
  btn.disabled = true;
  if (!S.sample) return saveMenu(localPlan(cfg, cands), cfg, st, btn);
  const ctl = new AbortController(); S.aiCtl = ctl;
  st.innerHTML = `<div class="status"><span class="spin"></span><span>La IA está preparando el menú…</span><span style="flex:1"></span><button class="textbtn" id="m-stop">Parar</button></div>`;
  $("#m-stop", sh).onclick = () => ctl.abort();
  let plan;
  try { plan = cleanPlan(await S.sample.json(menuPrompt(cfg, cands), {signal: ctl.signal, cache: false}), cfg); }
  catch(e){
    S.aiCtl = null; btn.disabled = false;
    const c = e && e.code;
    if (c === "cancelled"){ st.innerHTML = ""; return; }
    const msg = c === "rate_limited" ? "Has llegado al límite de uso de la IA por ahora."
      : ["not_granted","sampling_disabled","capability_disabled","capability_removed","not_declared"].includes(c) ? "Configura una IA en Ajustes."
      : aiErrMsg(e);
    st.innerHTML = `<p class="err">${esc(msg)}</p><button class="btn" id="m-local" style="margin-top:8px">Repartir sin IA</button>`;
    $("#m-local", sh).onclick = e2 => { e2.target.disabled = true; saveMenu(localPlan(cfg, cands), cfg, st, btn); };
    return;
  }
  S.aiCtl = null;
  await saveMenu(plan, cfg, st, btn);
}

function slotPers(menu, s){ return (s && s.personas) || (menu.config && menu.config.personas) || 4; }
function menuCounts(menu){
  const c = {legumbre:0, pescado:0, carne_blanca:0, carne_roja:0, huevo:0, cereal:0, verdura:0, otro:0};
  (menu.dias||[]).forEach(d => MEALS.forEach(m => { const x = d && d[m]; if (x && x.grupo && c[x.grupo] != null) c[x.grupo]++; }));
  return c;
}
function balanceHTML(menu){
  const c = menuCounts(menu), carne = c.carne_blanca + c.carne_roja;
  const items = [
    ["Legumbres", c.legumbre, "al menos 4", c.legumbre >= 4],
    ["Pescado", c.pescado, "al menos 3", c.pescado >= 3],
    ["Carne", carne, `máx. 3${c.carne_roja ? ` · ${c.carne_roja} roja` : ""}`, carne <= 3],
    ["Huevos", c.huevo, "hasta 4", c.huevo <= 4]
  ];
  return `<div class="bal">${items.map(([l,n,t,ok]) => `<div class="b ${ok?"ok":"wait"}"><b>${n}</b><span>${l}</span><small>${t}</small></div>`).join("")}</div>`;
}
function slotHTML(menu, d, i, m){
  const x = d[m];

  if (!x) body = `<span class="muted small">No coméis en casa</span>`;
  else {
    const r = x.receta_id ? getR(x.receta_id) : null;
